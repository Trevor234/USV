# Resume fine-tuning from v7_fusion_probe2/s4_dr over 55s episodes and balanced drag_ff_gain=0.70.
env_override:
  maneuver_seconds: 55.0
  q_ct: 180.0
  q_psi: 70.0
  q_u: 32.0
  q_v: 1.0
  q_r: 8.0
  r_thrust: 0.05
  r_dthrust: 0.6
  use_mode_energy: true
  r_cm: 0.06
  r_dm: 0.16
  drag_ff_gain: 0.70
  w_progress: 0.0

ppo_override:
  n_envs: 16
  seed: 42
  device: cuda
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: tanh
    equivariant_z2_se2: true
  fusion:
    lambda_pi: 0.01
    r_qpi_u0: 0.0005
  ppo:
    learning_rate: 1.5e-4
    lr_schedule: linear
    n_steps: 512
    batch_size: 1024
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.002
    vf_coef: 0.5
    max_grad_norm: 0.5
  eval:
    n_episodes: 12
    freq_steps: 16384
    path_type: scheme_a_mix
    deterministic: true
  curriculum:
    - name: s4_dr
      total_steps: 98304
      env_overrides:
        path_type: scheme_a_mix
        hydro_dr_frac: 0.2
        thrust_delay_max_steps: 0
        obs_noise_vel: 0.02
        obs_noise_pos: 0.05
