# C-ABI Pareto probe informed the tracking and mode-energy weights.
env_override:
  maneuver_seconds: 55.0
  init_pos_noise: 0.03
  init_psi_noise: 0.03
  init_vel_noise: 0.015
  q_ct: 240.0
  q_psi: 60.0
  q_u: 28.0
  q_v: 1.0
  q_r: 8.0
  r_thrust: 0.05
  r_dthrust: 0.6
  use_mode_energy: true
  r_cm: 0.075
  r_dm: 0.03  # Keep the differential-mode weight below MPC's 0.05.
  drag_ff_gain: 0.68
  w_progress: 0.0

ppo_override:
  n_envs: 16
  seed: 42
  device: cuda
  policy_kwargs:
    net_arch: [128, 128]
    activation_fn: tanh
    equivariant_z2_se2: true
    log_std_init: -0.85
  fusion:
    lambda_pi: 0.005
    r_qpi_u0: 0.0005
  ppo:
    learning_rate: 1.5e-4
    lr_schedule: linear
    n_steps: 512
    batch_size: 1024
    n_epochs: 8
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0003
    vf_coef: 0.5
    max_grad_norm: 0.5
  eval:
    n_episodes: 16
    freq_steps: 16384
    path_type: scheme_a_mix
    deterministic: true
  curriculum:
    - name: s4_dr
      total_steps: 196608
      env_overrides:
        path_type: scheme_a_mix
        hydro_dr_frac: 0.15
        thrust_delay_max_steps: 0
        obs_noise_vel: 0.0
        obs_noise_pos: 0.0
