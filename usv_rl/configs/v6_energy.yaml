env_override:
  q_ct: 100.0
  q_psi: 50.0
  q_u: 45.0
  q_v: 1.0
  q_r: 8.0
  r_thrust: 0.05
  r_dthrust: 0.25
  use_mode_energy: true
  r_cm: 0.08
  r_dm: 0.16
  drag_ff_gain: 1.0
  w_progress: 10.0

ppo_override:
  seed: 42
  n_envs: 16
  device: cpu
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: tanh
  ppo:
    learning_rate: 3.0e-4
    lr_schedule: linear
    n_steps: 2048
    batch_size: 4096
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.005
    vf_coef: 0.5
    max_grad_norm: 0.5
  eval:
    n_episodes: 12
    freq_steps: 50000
    path_type: scheme_a_mix
    deterministic: true
  curriculum:
    - name: s1_straight
      total_steps: 1000000
      env_overrides:
        path_type: straight
    - name: s2_turns
      total_steps: 1500000
      env_overrides:
        path_type: random
    - name: s3_mix
      total_steps: 3500000
      env_overrides:
        path_type: scheme_a_mix
    - name: s4_dr
      total_steps: 4000000
      env_overrides:
        path_type: scheme_a_mix
        hydro_dr_frac: 0.2
        thrust_delay_max_steps: 1
        obs_noise_vel: 0.02
        obs_noise_pos: 0.05
        r_dthrust: 0.40
        w_progress: 8.0
        q_u: 50.0
