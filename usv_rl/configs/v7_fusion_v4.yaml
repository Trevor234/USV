# v7_fusion_v4: 55s ROS2-aligned horizon + bounded log_std_init=-0.9 + balanced probe2/v2 weights.
env_override:
  maneuver_seconds: 55.0
  init_pos_noise: 0.15
  init_psi_noise: 0.15
  init_vel_noise: 0.03
  q_ct: 200.0
  q_psi: 75.0
  q_u: 35.0
  q_v: 1.0
  q_r: 8.0
  r_thrust: 0.05
  r_dthrust: 0.6
  use_mode_energy: true
  r_cm: 0.06
  r_dm: 0.16
  drag_ff_gain: 0.72
  w_progress: 0.0

ppo_override:
  n_envs: 16
  seed: 42
  device: cuda
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: tanh
    equivariant_z2_se2: true
    log_std_init: -0.9
  fusion:
    lambda_pi: 0.01
    r_qpi_u0: 0.0008
  ppo:
    learning_rate: 1.5e-4
    lr_schedule: linear
    n_steps: 512
    batch_size: 1024
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.001
    vf_coef: 0.5
    max_grad_norm: 0.5
  eval:
    n_episodes: 12
    freq_steps: 32768
    path_type: scheme_a_mix
    deterministic: true
  curriculum:
    - name: s4_dr
      total_steps: 196608
      env_overrides:
        path_type: scheme_a_mix
        hydro_dr_frac: 0.2
        thrust_delay_max_steps: 0
        obs_noise_vel: 0.02
        obs_noise_pos: 0.05
