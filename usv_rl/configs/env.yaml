# UsvTrackingEnv 环境参数（构造函数 kwargs 全集）。
# 水动力默认取 usv_rl.dynamics.HydroParams（usv_params_sim.yaml 2026-09 快照）；
# 方案 A 融合闭环（P5）另从运行目录 contract.json 的 hydro 段加载。
# 奖励权重与 usv_mpc_ws/src/usv_bringup/config/mpc_params.yaml 的 dynamic.Q/R/Rd 同量纲，
# 但位置项用路径几何横向误差 e_ct（见 usv_rl/envs/reward.py）。

# --- 时间步与时域（与 MPC 一致：5 Hz）---
dt: 0.2
rk4_substeps: 4
max_steps: 450            # 绝对上限 90 s；实际按参考剖面时长 +5s 自适应

# --- 执行器约束（与 MPC mpc_params.yaml 一致）---
t_max_thrust: 25.0        # N，双桨推力上限
d_t_max: 80.0             # N/s，推力变化率上限

# --- 观测契约 ppo-obs-v2（= usv_rl.observation.LOOKAHEAD_M，部署节点同值）---
# 取值来自 P1.4 三臂闭环消融：adopt_training=False → 用方案 A 元组
lookahead: [0.4, 0.8, 1.4, 2.2, 3.2, 4.4, 5.8, 7.5]
path_resolution: 0.5      # m，与规划器 path_config.yaml 一致
progress_gate_m: 1.0      # 窗口内最近点远于此值则不记进度（远离航线不算前进）
obs_prev_thrust_timing: post_update   # 与部署侧 confirmed executed thrust 对齐

# --- 奖励权重（TrackingCostParams）---
q_ct: 100.0               # 横向误差权重（平方-线性过渡）
q_psi: 50.0
q_u: 8.0
q_v: 1.0
q_r: 8.0
r_thrust: 0.05
r_dthrust: 0.2
reward_scale: 0.2         # 整体缩放，使单步奖励量级 ~1
w_progress: 15.0          # 进度项权重：完成 ~20 m 的进度收益须显著大于巡航总代价
ct_linear_m: 1.0          # |e_ct| 超过该值后惩罚从平方转线性（保住远场梯度）
success_bonus: 10.0
failure_penalty: 10.0

# --- 终止/成功判据 ---
pos_err_limit: 3.0        # m（空间参考）
psi_err_limit: 1.5707963  # rad (90°，空间参考)
early_termination: false  # 训练期违规不判死：只要早死比带伤活着省，PPO 就先学死
                          # （v3 教训：ep_len 303→27.7 单调衰减，策略主动求死）
finish_radius_m: 1.0      # m，距路径终点的完成半径
success_cte_limit_m: 0.75 # m，全程 |e_ct| 上限（挡住"蒙到终点但全程离航线"的策略）

# --- 参考轨迹 ---------------------------------------------------------------
# scheme_a_mix = 方案 A 机动生成器（straight/left_turn/right_turn/s_turn/
#   rate_limited_thrust_step/speed_transition）均匀抽样，与受控仿真同分布。
path_type: scheme_a_mix
maneuver_seconds: 30.0
maneuver_cruise_speed: [0.55, 0.85]

# --- Domain randomization（训练末段开启，评估关闭）---
hydro_dr_frac: 0.0        # 水动力 19 参数 ±frac 均匀扰动
thrust_delay_max_steps: 0 # 推力执行延迟 0~N 步
obs_noise_vel: 0.0        # u/v/r 观测噪声 sigma
obs_noise_pos: 0.0        # 位置观测噪声 sigma

# --- 初始扰动 ---
init_pos_noise: 0.3       # m
init_psi_noise: 0.3       # rad
init_vel_noise: 0.05      # m/s, rad/s
