# Low-variance bounded-residual equivariant PPO with FUSION_ENV=1.
env_override:
  q_ct: 140.0
  q_psi: 70.0
  q_u: 25.0
  q_v: 1.0
  q_r: 8.0
  r_thrust: 0.05
  r_dthrust: 0.8
  use_mode_energy: true
  r_cm: 0.070
  r_dm: 0.28
  drag_ff_gain: 0.72
  w_progress: 0.0

ppo_override:
  n_envs: 16
  seed: 42
  device: cuda
  policy_kwargs:
    net_arch: [128, 128]
    activation_fn: tanh
    equivariant_z2_se2: true
    log_std_init: -1.6
  fusion:
    lambda_pi: 0.01
    r_qpi_u0: 0.004
  ppo:
    learning_rate: 1.0e-4
    lr_schedule: linear
    n_steps: 512
    batch_size: 1024
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0002
    vf_coef: 0.5
    max_grad_norm: 0.5
  eval:
    n_episodes: 16
    freq_steps: 32768
    path_type: scheme_a_mix
    deterministic: true
  curriculum:
    - name: s4_dr
      total_steps: 262144
      env_overrides:
        path_type: scheme_a_mix
        hydro_dr_frac: 0.2
        thrust_delay_max_steps: 0
        obs_noise_vel: 0.02
        obs_noise_pos: 0.05
