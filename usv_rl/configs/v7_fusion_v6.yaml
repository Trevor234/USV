# M6 reward with K02r warm-start and short CUDA PPO fine-tuning.
env_override:
  maneuver_seconds: 55.0
  init_pos_noise: 0.03
  init_psi_noise: 0.03
  init_vel_noise: 0.015
  q_ct: 380.0
  q_psi: 65.0
  q_u: 26.0
  q_v: 1.0
  q_r: 8.0
  r_thrust: 0.05
  r_dthrust: 0.6
  use_mode_energy: true
  r_cm: 0.105
  r_dm: 0.015
  drag_ff_gain: 0.64
  w_progress: 0.0

ppo_override:
  n_envs: 16
  seed: 42
  device: cuda
  policy_kwargs:
    net_arch: [128, 128]
    activation_fn: tanh
    equivariant_z2_se2: true
    log_std_init: -1.4
  fusion:
    lambda_pi: 0.005
    r_qpi_u0: 0.0005
  ppo:
    learning_rate: 5.0e-5
    lr_schedule: linear
    n_steps: 512
    batch_size: 1024
    n_epochs: 6
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.1
    ent_coef: 0.0001
    vf_coef: 0.5
    max_grad_norm: 0.5
  eval:
    n_episodes: 16
    freq_steps: 16384
    path_type: scheme_a_mix
    deterministic: true
  curriculum:
    - name: s4_dr
      total_steps: 131072
      env_overrides:
        path_type: scheme_a_mix
        hydro_dr_frac: 0.15
        thrust_delay_max_steps: 0
        obs_noise_vel: 0.0
        obs_noise_pos: 0.0
