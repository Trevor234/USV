/**:
  ros__parameters:
    # --- VRX 仿真 overlay (配合 usv_params_sim.yaml 使用) ---
    # 由原 mpc_params_vrx_scheme_b.yaml (Python 动力学 MPC 时代) 迁移而来,
    # 数值整定保持不变: 单推进器 40 N / 反推 20 N 的 30 kg 单体仿真船。
    # MPC 为 C++ usv_mpc_cpp 动力学 NMPC, output_mode=vrx_thrust 直接发布推力。

    control_mode: "dynamic"
    output_mode: "vrx_thrust"      # C++ mpc_node: 推力直发 Gazebo thruster topic
    require_fcu_state: false       # 仿真无 mavros state 流
    mpc_dt: 0.2                    # 5 Hz 控制回路
    horizon: 18
    max_solve_time_ms: 200.0
    odom_timeout_s: 2.0
    state_timeout_s: 0.0
    reference_start_offset: 8
    cruise_speed: 0.8

    # gz Thruster 接收 [N]。NMPC [T_L,T_R] 已是 N -> 1:1 发布。
    # cmd_max 远高于 40 N 单桨上限, 仅作安全限幅, 不会截断 T_max。
    vrx_thrust_scale: 1.0
    vrx_thrust_cmd_max: 100.0

    dynamic:
      # 40 N 推力量级下的权重 (相对真船 25 N 版重新缩放的起点, 按跟踪效果微调)
      Q: [50.0, 50.0, 70.0, 6.0, 1.0, 25.0]  # State weights [x,y,psi,u,v,r]
      R: [0.05, 0.05]              # Control weights [TL, TR]
      Rd: [0.2, 0.2]
      Qf_scale: 12.0
      dt: 0.3                      # dyn_N = round(18*0.2/0.3) = 12, 保 5 Hz 实时性
      T_max: 40.0                  # Max thrust per thruster (N)
      T_min: -20.0                 # Max reverse thrust (N)
      dT_max: 80.0                 # Max thrust rate (N/s)

    # 注: steering_gain/throttle_gain 只被 rc_override 后端使用;
    # vrx_thrust 直接发布推力, 不经过它们。
