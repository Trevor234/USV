/**:
  ros__parameters:
    # --- VRX 仿真 overlay (配合 usv_params_sim.yaml 使用) ---
    # vrx.launch.py 为生成的原生 SDF 与 MPC 加载相同的 effective_vehicle.yaml。
    # 水平面附加质量交叉项作显式对称化；三维浮力/姿态仍是近似。
    # 推力按 N 1:1 直发，闭环仿真结论需要实机复验。

    control_mode: "dynamic"
    output_mode: "vrx_thrust"      # C++ mpc_node: 推力直发 Gazebo thruster topic
    require_fcu_state: false       # 仿真无 mavros state 流
    mpc_dt: 0.2                    # 5 Hz 控制回路
    horizon: 20                    # 必须保持 dyn_N = round(20*0.2/dt) = 20:
    max_solve_time_ms: 200.0       # vendored acados codegen (usv_dyn_nmpc) 的 N=20
    odom_timeout_s: 2.0            # 是编译期固定维度, 改 horizon/dt 组合会求解失败
    state_timeout_s: 0.0
    reference_start_offset: 2
    cruise_speed: 0.6

    # gz Thruster 接收 [N]。NMPC [T_L,T_R] 已是 N -> 1:1 发布。
    # cmd_max 高于默认 25 N 单桨上限；launch 最终按物理 YAML 覆盖 T_min/T_max。
    vrx_thrust_scale: 1.0
    vrx_thrust_cmd_max: 100.0
    # 最终发布值还会按 dynamic.T_min/T_max 限幅，并直接写回下一拍 delta_T
    # 锚点；scale=1.0 时模型推力、Gazebo 输入和锚点均保持 N 单位一致。

    dynamic:
      # 2026-09-06: 权重与实机部署值对齐 (mpc_params_B.yaml) —— 仿真与实机
      # 同一套控制器参数, sqrt(Qx/R)=20N=80%T_max, 消除推力饱和(002 包 54.8%)。
      # Q/R/Rd 为运行代价密度, acados/CasADi 均对整段阶段代价乘 dt;
      # Qf_scale 作用于不乘 dt 的终端代价。Rd 是固定 dt 下的逐步 ΔT 平滑权重。
      Q: [20.0, 20.0, 50.0, 8.0, 1.0, 8.0]  # State weights [x,y,psi,u,v,r]
      R: [0.05, 0.05]              # Control weights [TL, TR]
      Rd: [0.2, 0.2]
      Qf_scale: 8.0
      dt: 0.2                      # 必须与 horizon 组合出 dyn_N=20 (codegen 固定), 不可改 0.3
      T_max: 25.0                  # Max thrust per thruster (N) — 实船辨识 K=1.64e-6 N/RPM² @ 3900RPM
      T_min: -25.0                 # Max reverse thrust (N) — 正反等推力 (7-23)
      dT_max: 80.0                 # Max thrust rate (N/s) — 7-23 实船值

    # 注: steering_gain/throttle_gain 只被 rc_override 后端使用;
    # vrx_thrust 直接发布推力, 不经过它们。
