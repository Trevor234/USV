# Path Configuration
#
# Defines Mission Planner waypoint input, path parameters, and planning behavior.

# --- Mission Planner waypoints converted to local map coordinates ---
/**:
  ros__parameters:
    path_resolution: 0.5        # 采样路径点间距 (m)
    turn_radius: 12.0           # 最小转弯半径 / 圆弧倒角半径 (m)；36点圆需 <15·cos5°=14.94 才不裁剪
    update_rate: 1.0            # 路径更新频率 (Hz)
    waypoints_file: ""          # 默认不加载本地 YAML 航点，等待 Mission Planner 航点
    path_topic: "/path/reference"                            # 参考路径 (nav_msgs/Path: x,y,psi)
    profile_topic: "/path/reference_profile"                 # 速度剖面 (Float64MultiArray[M,4]=v,kappa,r,t)
    dynamic_waypoints_topic: "/usv/mission/waypoints_local"  # 来自 mission_bridge_node 的动态航点
    default_waypoint_radius: 2.0     # 动态航点的到达判定半径 (m)

    # --- 速度剖面 (TOPP) 约束 ---
    # 重要：u_max / r_max 必须 <= MPC 的 kinematic.u_max / kinematic.r_max
    # （规划可行域 ⊆ 控制可行域），见 mpc_params.yaml。
    u_max: 0.8              # TOPP 巡航速度上限 (m/s)，VRX WAM-V 跟踪保守限速
    r_max: 0.18             # 最大转艏角速度 (rad/s)，避免命令过急转弯
    lat_accel_max: 0.12     # 最大侧向加速度 (m/s^2)，限制过弯速度
    accel_max: 0.18         # 最大纵向加速 (m/s^2)
    decel_max: 0.25         # 最大纵向减速 (m/s^2)
    v_end: 0.0              # 末端目标速度 (m/s)，靠近终点减速
    v_min: 0.2              # 最小速度下限，保证时间参数推进 (m/s)

    # --- 可选：最小曲率精修 NLP（默认关闭，开启会增加规划耗时）---
    enable_curvature_opt: false
    curvature_opt_max_iter: 40
    curvature_opt_corridor: 1.0      # 走廊半宽 (m)
