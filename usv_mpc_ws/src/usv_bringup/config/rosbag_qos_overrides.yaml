# rosbag2 subscription overrides for MAVROS sensor-data publishers.
/mavros/local_position/odom:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

/mavros/imu/data:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

# raw/fix 的录制器采用 best_effort 订阅请求; 在 reliability 维度与
# best_effort 或 reliable 发布端兼容, 其余 QoS 和实际接收需实机核验。
# 此配置不声明发布端的实测 QoS。
# gpsstatus/gps1/raw 未配置显式覆盖, 实机前需核对端点 QoS 与录制结果。
/mavros/global_position/raw/fix:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

# MAVLink 原始帧: 发布端为 BEST_EFFORT/VOLATILE/KEEP_LAST depth=1000,
# 录制器显式匹配同维度。不要求 RELIABLE, 不承诺零丢失。
# 此处只声明订阅请求, 不代表已收到帧或已覆盖飞控全部物理通道。
/uas1/mavlink_source:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000

/uas1/mavlink_sink:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
