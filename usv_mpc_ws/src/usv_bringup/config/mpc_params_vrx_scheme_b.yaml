/**:
  ros__parameters:
    # Scheme B overlay for the SINGLE-HULL VRX model (usv_simulation/urdf/usv_mono.urdf.xacro).
    # Dynamics match the real 2 m / 30 kg dual-thruster USV (usv_params.yaml),
    # NOT the 180 kg WAM-V catamaran. Keep this file in sync with both the sim
    # hydrodynamics (usv_mono_dynamics.xacro) and usv_params.yaml.
    scheme: "B"
    control_mode: "dynamic"
    output_mode: "vrx_thrust"
    require_fcu_state: false
    # Keep the VRX NMPC small enough for a 5 Hz control loop.
    # With mpc_dt=0.2, horizon=18, and dynamic.dt=0.3, mpc_node builds
    # dynamic_N=round((18*0.2)/0.3)=12.
    mpc_dt: 0.2
    horizon: 18
    max_solve_time_ms: 200.0
    odom_timeout_s: 2.0
    state_timeout_s: 0.0
    vrx_left_thrust_topic: "/wamv/thrusters/left/thrust"
    vrx_right_thrust_topic: "/wamv/thrusters/right/thrust"
    # gz Thruster takes [N]. NMPC [T_L,T_R] are already Newtons -> publish 1:1.
    # cmd_max well above the 40 N single-thruster limit so it never clips T_max.
    vrx_thrust_scale: 1.0
    vrx_thrust_cmd_max: 100.0

    reference_start_offset: 8
    cruise_speed: 0.8

    # ===================== 2 m monohull dynamics (real boat) =====================
    # Source: usv_bringup/config/usv_params.yaml (single source of truth).
    # The sim plant (usv_mono_dynamics.xacro) uses the same surge/sway/yaw
    # magnitudes, so MPC model and Gazebo plant stay consistent.
    vehicle:
      mass: 30.0
      Iz: 8.0
      xg: 0.0
      d_thruster: 0.3
      # Added mass (Fossen-negative)
      Xu_dot: -3.0
      Yv_dot: -20.0
      Yr_dot: -0.5
      Nv_dot: -0.5
      Nr_dot: -2.0
      # Linear damping
      Xu: -8.0
      Yv: -30.0
      Yr: -1.0
      Nv: -1.0
      Nr: -5.0
      # Quadratic damping
      Xuu: -15.0
      Yvv: -60.0
      Yrr: -1.0
      Nvv: -1.0
      Nrr: -3.0

    dynamic:
      # Per-thruster limit 40 N (usv_params thruster.T_max_forward), reverse 20 N.
      # R/Rd re-scaled up vs the WAM-V overlay because thrust magnitudes shrank
      # ~6x (250 N -> 40 N); these are starting points — tune against tracking.
      Q: [50.0, 50.0, 70.0, 6.0, 1.0, 25.0]
      R: [0.05, 0.05]
      Rd: [0.2, 0.2]
      Qf_scale: 12.0
      dt: 0.3
      T_max: 40.0
      T_min: -20.0
      dT_max: 80.0

    # steering_gain/throttle_gain only used by the RC-override backend; vrx_thrust
    # publishes thrust directly and does not pass through them.
    steering_gain: 0.3
    throttle_gain: 1.0
