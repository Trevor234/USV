# USV 话题契约 (Topic Contract) — real.launch.py 全系统话题接口单一事实来源
#
# 本文件文档化各节点订阅/发布的话题名、类型、坐标系与 QoS,以及 NMPC
# (动力学, RC override) 所依赖的 path/profile 时间同步契约。供:
#   - 人工核对节点间接线
#   - test_config_smoke.py 验证关键契约字面量存在 (stamp_sec/stamp_nanosec 等)
#   - 跨包重构时保持接口一致
#
# 注意:话题名默认值在 real.launch.py 的 LaunchArgument 中定义,可在启动时覆盖。
#       本文件是文档,不作为 ROS 参数加载 (无 ros__parameters 根)。

mpc_controller_node:
  subscribes:
    - topic: /mavros/local_position/odom
      type: nav_msgs/msg/Odometry
      frame: map          # 位姿在 local map;twist 在 base_link
      qos: sensor_data
      purpose: EKF 融合位姿与速度 (x, y, psi, u, v, r)
    - topic: /mavros/imu/data
      type: sensor_msgs/msg/Imu
      frame: base_link
      qos: sensor_data
      purpose: 直接陀螺仪角速度,提供比 odom 更灵敏的 r 测量
    - topic: /path/reference
      type: nav_msgs/msg/Path
      frame: map
      qos: depth=10
      purpose: 规划器参考路径 (位置 + 航向);header.stamp 用于与 profile 配对
    - topic: /path/reference_profile
      type: std_msgs/msg/Float64MultiArray
      qos: depth=10
      purpose: 逐点速度剖面 [M,4]=(v, kappa, r, t),与 /path/reference 逐点对应
      # stamp 同步契约见下方 path_profile_sync
    - topic: /mavros/state
      type: mavros_msgs/msg/State
      qos: depth=10
      purpose: FCU 连接/解锁/模式 (armed, mode),驱动 STANDBY/ACTIVE 状态机
  publishes:
    - topic: /mavros/rc/override
      type: mavros_msgs/msg/OverrideRCIn
      qos: depth=10
      purpose: NMPC 控制输出 (RC 通道覆写);MPC 推力 → throttle/steering PWM
      rc_channels:
        steering: { channel: 1, default_index: 0 }   # CH1, rc_steering_channel=0
        throttle: { channel: 3, default_index: 2 }   # CH3, rc_throttle_channel=2
      pwm_range: { min: 1100, center: 1500, max: 1900 }
      # 释放: 全零 OverrideRCIn 表示释放所有通道 (FCU 回到正常 RC 输入)
    - topic: /mpc/status
      type: std_msgs/msg/String
      qos: depth=10
      payload: JSON
      purpose: 求解器诊断 (mode_manager_node 消费 + GCS 显示)
      # 关键字段: state(ACTIVE/HOLD/STANDBY), success, fail_count,
      #           solve_time_ms, deadline_miss, hold, control_mode,
      #           fcu_mode, armed, path_received, profile_synced,
      #           tl_n/tr_n (执行层等效推力), tl_cmd_n/tr_cmd_n (求解器计划),
      #           actuation_anchor_source, actuation_mapping_error_n;
      # 方案 A 另含: initial_state_residual, max_dynamics_residual,
      #              max_control_bound_violation, max_control_rate_violation
      # mode_manager 仅消费: success/fail_count/solve_time_ms/hold/state/standby_reason
    - topic: /mpc/predicted_trajectory
      type: nav_msgs/msg/Path
      frame: map
      qos: depth=10
      purpose: MPC 预测轨迹可视化 (每 5 个控制周期发布一次)

path_planner_node:
  subscribes:
    - topic: /mavros/local_position/odom
      type: nav_msgs/msg/Odometry
      purpose: 当前位姿 (TOPP 起点速度 v_start 取 odom.twist.linear.x)
    - topic: /usv/mission/waypoints_local
      type: nav_msgs/msg/Path
      purpose: mission_bridge 下发的局部航点 (仅位置;航向由 fillet 倒角推导)
  publishes:
    - topic: /path/reference
      type: nav_msgs/msg/Path
      frame: map
      purpose: 平滑参考路径 (fillet 圆弧倒角);与 profile 同周期发布
    - topic: /path/reference_profile
      type: std_msgs/msg/Float64MultiArray
      purpose: TOPP 速度剖面 [M,4]=(v, kappa, r, t);与 path 同周期同长度发布

mission_bridge_node:
  subscribes:
    - topic: /mavros/mission/waypoints
    - topic: /mavros/global_position/gp_origin
  publishes:
    - topic: /usv/mission/waypoints_local
      type: nav_msgs/msg/Path
      purpose: 经纬度航点 → 局部 map 坐标

mode_manager_node:
  subscribes:
    - topic: /mavros/state
    - topic: /mpc/status               # 解析 JSON,监视求解器健康
    - topic: /mavros/local_position/odom  # geofence / 速度限制
    - topic: /path/reference           # path watchdog
    - topic: /mavros/battery           # 电池 failsafe
  services:
    - /mavros/set_mode
    - /mavros/cmd/arming

# ---------------------------------------------------------------------------
# GPS 状态话题 (2026-10-09 加入 bag_topics.yaml 录制; RTK 事后分析用)
# ---------------------------------------------------------------------------
# 用途: 区分任务录制数据中的定位质量段 (单点/RTK Float/RTK Fixed),配合
# odom (EKF 融合了 RTK 结果) 做参数辨识与跟踪误差分析。
# 本实机清单不录 RTCM 原始流; 发布速率需测量, 回放不能替代实时差分连接。
gps_status_topics:
  - topic: /mavros/gpsstatus/gps1/raw
    type: mavros_msgs/msg/GPSRAW
    qos: runtime_endpoint_check_required
    # 发布端 QoS 需实机 ros2 topic info --verbose 核对。
    purpose: fix_type (3=单点, 5=RTK Float, 6=RTK Fixed), eph, 卫星数
  - topic: /mavros/global_position/raw/fix
    type: sensor_msgs/msg/NavSatFix
    qos: runtime_endpoint_check_required
    # 发布端 QoS 需实机核对; 录制订阅请求见 rosbag_qos_overrides.yaml。
    purpose: GPS 经纬度原值; 亦为 NTRIP 客户端 GGA 上报来源 (经 /fix_for_ntrip
             QoS 中继, 见 ntrip.launch.py)

# ---------------------------------------------------------------------------
# path / profile 时间同步契约 (核心)
# ---------------------------------------------------------------------------
# /path/reference (NavPath) 与 /path/reference_profile (Float64MultiArray) 必须由
# path_planner_node 在同一周期、同长度发布,以便 mpc_node 按时间重采样动力学参考。
#
# /path/reference 的 stamp = path_msg.header.stamp
#   (path_planner_node._publish_path 用 get_clock().now() 写入)
#
# /path/reference_profile 无 header 字段,stamp 编码进 Float64MultiArray.layout.dim
# 的末两维 (path_planner_node._build_profile_msg):
#   - dim.label = "stamp_sec:<sec>"      # 整数秒
#   - dim.label = "stamp_nanosec:<nanosec>"  # 纳秒
# 两个 dim 的 size=0, stride=0, 仅作元数据载体。
#
# 解析方: usv_mpc_cpp utils.hpp usv_mpc::parse_profile_stamp(layout) -> (sec, nanosec)
# 同步判据: usv_mpc_cpp utils.hpp usv_mpc::profile_sync_state(path_len, profile_len, path_stamp, profile_stamp)
#   - 长度相等 且 stamp 相等 -> "stamp_match" (优先按时间重采样)
#   - stamp 缺失 -> "legacy_no_profile_stamp" (兼容旧规划器,仍按长度对齐)
#   - 长度/stamp 不一致 -> 回退匀速弧长采样, profile_synced=False
#
# 消费方: mpc_node._profile_callback / _build_reference (按 profile_stamp 与
#         _reference_path_stamp 比对决定参考构建路径)。
path_profile_sync:
  reference_topic: /path/reference
  profile_topic: /path/reference_profile
  stamp_encoding:
    layout_dim_labels: ["stamp_sec", "stamp_nanosec"]
  parser: usv_mpc_cpp::usv_mpc::parse_profile_stamp
  sync_check: usv_mpc_cpp::usv_mpc::profile_sync_state
  consumer: mpc_node.MpcControllerNode._build_reference
