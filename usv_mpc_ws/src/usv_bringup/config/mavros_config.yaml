# MAVROS Configuration for USV MicoAir743
#
# Serial connection: validated FCU MAVLink port → /dev/ttyAMA10 on RPi5
# Baud rate: 921600
#
# fcu_url: primary MAVLink link between Raspberry Pi and flight controller
# gcs_url: optional MAVLink forwarding endpoint for a ground station
#          on the Raspberry Pi network
#
# Load only the plugins used by this workspace. This avoids a Jazzy MAVROS
# topic type collision on /mavros/mavros/status from unrelated status plugins.

/**:
  ros__parameters:
    fcu_url: "/dev/ttyAMA10:921600"
    gcs_url: "udp://@10.210.191.110:14550"
    tgt_system: 1
    tgt_component: 1
    system_id: 255
    component_id: 191
    target_system_id: 1
    target_component_id: 1
    fcu_protocol: "v2.0"
    use_comp_id_system_control: false

    plugin_allowlist:
      - "local_position"
      - "imu"
      - "rc_io"
      - "rc_override"
      - "setpoint_velocity"
      - "command"
      - "global_position"
      - "waypoint"
    plugin_denylist:
      - "_disabled_plugin_name_that_matches_nothing"


