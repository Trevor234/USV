# Core closed-loop topics recorded during real USV runs.
# Message types, QoS, and semantics remain defined in topic_contract.yaml.
# 2026-10-09: 加入 GPS 状态话题 (RTK 事后分析需要区分 Float/Fixed/单点段)。
#   raw/gps1/raw = fix_type/eph/卫星数 (GPSRAW, ~1Hz)
#   raw/fix      = 经纬度原值 (NavSatFix, ~1Hz)
#   RTCM 差分原始流 (send_rtcm) 不录: 5Hz 高流量, 事后无法重放。
topics:
  - /mavros/local_position/odom
  - /mavros/imu/data
  - /mavros/state
  # 方案 B 的控制输出 (OverrideRCIn)。方案 A 下该话题无 publisher,
  # 录不到数据但保留兼容。
  - /mavros/rc/override
  # 方案 A 的控制输出 (TwistStamped, u_surge + r_yaw), 5 Hz RELIABLE。
  # 2026-10-21: 此前只录 rc/override, 实机跑方案 A 时真正的执行指令
  # 完全没有落盘, 事故复盘无法重放控制输出。
  - /mavros/setpoint_velocity/cmd_vel
  - /mpc/status
  - /path/reference
  - /path/reference_profile
  - /usv/mission/waypoints_local
  - /mpc/predicted_trajectory
  - /mavros/gpsstatus/gps1/raw
  - /mavros/global_position/raw/fix
