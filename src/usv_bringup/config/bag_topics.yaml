# 实船运行期间录制的核心闭环话题。
# 消息类型、QoS 与语义定义仍以 topic_contract.yaml 为准。
# 2026-10-09: 加入 GPS 状态话题 (RTK 事后分析需要区分 Float/Fixed/单点段)。
#   raw/gps1/raw = fix_type/eph/卫星数 (GPSRAW, ~1Hz)
#   raw/fix      = 经纬度原值 (NavSatFix, ~1Hz)
#   RTCM 差分原始流 (send_rtcm) 不录: 5Hz 高流量, 事后无法重放。
#   MAVROS 若通过 UAS 发出 GPS_RTCM_DATA 帧, 该帧会自然出现在下面两个
#   MAVLink 帧话题里; 单独 RTCM ROS 话题仍不录。
topics:
  - /mavros/local_position/odom
  - /mavros/imu/data
  - /mavros/state
  # 方案 B 的控制输出 (OverrideRCIn)。方案 A 下该话题无 publisher,
  # 录不到数据但保留兼容。
  - /mavros/rc/override
  # 方案 A 的控制输出 (TwistStamped, u_surge + r_yaw), 5 Hz RELIABLE。
  # 2026-10-21: 此前只录 rc/override, 实机跑方案 A 时真正的执行指令
  # 完全没有落盘, 事故复盘无法重放控制输出。
  - /mavros/setpoint_velocity/cmd_vel
  - /mpc/status
  - /path/reference
  - /path/reference_profile
  - /usv/mission/waypoints_local
  # WeAct 功率计电池 (2026-11-14): 电压/电流(放电为负)/SOC。
  # 低电量 failsafe 与事后续航分析的数据源。
  - /usv/battery
  - /mpc/predicted_trajectory
  - /mavros/gpsstatus/gps1/raw
  - /mavros/global_position/raw/fix
  # MAVLink 双向帧 (mavros_msgs/msg/Mavlink, MAVROS 2.14 原生接口)。
  # source = 路由器交给 UAS 的入站帧 (飞控下传),
  # sink   = UAS 封装后发出的报文 (仅表示发送意图, 不代表串口已发出)。
  # 全消息 ID 保留, 不按插件/msgid 过滤。BEST_EFFORT depth 1000。
  - /uas1/mavlink_source
  - /uas1/mavlink_sink
