# 无人艇物理参数 — 单一事实来源（方案 A）。
#
# 注意：运动学 MPC 节点（usv_mpc）不会读取这些船体（`vehicle.*`）参数；
# 此处保留作为规范的船体参数描述。

/**:
  ros__parameters:
    # ----- 船体参数（规范船体描述；运动学 MPC 仅作参考）-----
    vehicle:
      mass: 14.2          # 总质量（含载荷），单位 kg
      Iz: 2.13            # 艏摇转动惯量 (= m(L²+B²)/12)，单位 kg·m²
      xg: 0.12            # 重心纵向偏移（+ 向前），单位 m
      d_thruster: 0.25    # 推进器半间距（总间距 2d = 0.5 m），单位 m

      # ----- 船体几何尺寸（MPC 仅作参考）-----
      length: 1.2         # 总长，单位 m
      beam: 0.6           # 船宽，单位 m
      draft: 0.10         # 吃水深度，单位 m
      height: 0.30        # 干舷高度，单位 m

      # ----- 附加质量（按 Fossen 约定取负值）-----
      Xu_dot: -2.0
      Yv_dot: -8.0
      Yr_dot: 0.0
      Nv_dot: -0.363545
      Nr_dot: -1.621220

      # ----- 线性阻尼 -----
      Xu: -2.272063
      Yv: -2.629019
      Yr: 0.0             # 置零（原因见上方注释）
      Nv: 0.0             # 置零（原因见上方注释）
      Nr: -4.286144

      # ----- 二次阻尼 -----
      Xuu: -11.571784
      Yvv: -0.05          # 极小的对角阻尼项，保留
      Yrr: 0.0            # 置零 — 共用横荡-艏摇耦合通道
      Nvv: 0.0            # 置零 — 共用横荡-艏摇耦合通道
      Nrr: -0.001         # 极小的对角阻尼项，保留

    # ----- 推进器 -----
    # 注意：运动学 MPC 不直接使用推力上限；
    # 此处保留作为无人艇的标称推力规格（与 usv_params_B.yaml 同步 2026-11-18 标定结果）。
    thruster:
      pwm_min: 1000
      pwm_center: 1500
      pwm_max: 2000
      T_max_forward: 57.66  # 实测单侧推进器最大正向推力 (N, 2026-11-18 标定峰值)
      T_max_reverse: 25.0   # 单侧推进器最大反向推力 (N，正反相等)
