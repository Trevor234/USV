# ---------------------------------------------------------------------------
# 注意：本文件已升级为通过 topic_contract.yaml 动态派生。
# 录制运行时（record.launch.py）默认由 topic_contract.yaml 自动生成此 QoS 覆盖表。
# 保留本文件仅供向下兼容与静态审计参考。增删话题或修改 QoS 请直接编辑 topic_contract.yaml。
# ---------------------------------------------------------------------------
# 针对 MAVROS sensor-data 发布端的 rosbag2 订阅 QoS 覆盖配置。
/mavros/local_position/odom:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

/mavros/imu/data:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

# WeAct 功率计电池: 发布端 sensor-data (BEST_EFFORT/KEEP_LAST 5)。
/usv/battery:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

/mavros/global_position/raw/fix:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

# MAVLink 原始帧: 发布端为 BEST_EFFORT/VOLATILE/KEEP_LAST depth=1000,
# 录制器显式匹配同维度。不要求 RELIABLE, 不承诺零丢失。
# 此处只声明订阅请求, 不代表已收到帧或已覆盖飞控全部物理通道。
/uas1/mavlink_source:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000

/uas1/mavlink_sink:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
