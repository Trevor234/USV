# rosbag2 subscription overrides for MAVROS sensor-data publishers.
/mavros/local_position/odom:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

/mavros/imu/data:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5

/mavros/global_position/raw/fix:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
