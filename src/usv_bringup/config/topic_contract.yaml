# USV 话题契约 (Topic Contract) — real.launch.py 全系统话题接口单一事实来源
#
# 本文件文档化各节点订阅/发布的话题名、类型、坐标系与 QoS,以及 NMPC
# (动力学, RC override) 所依赖的 path/profile 时间同步契约。供:
#   - 人工核对节点间接线
#   - test_config_smoke.py 验证关键契约字面量存在 (stamp_sec/stamp_nanosec 等)
#   - 跨包重构时保持接口一致
#
# 注意:话题名默认值在 real.launch.py 的 LaunchArgument 中定义,可在启动时覆盖。
#       本文件是文档,不作为 ROS 参数加载 (无 ros__parameters 根)。

mpc_controller_node:
  subscribes:
    - topic: /mavros/local_position/odom
      type: nav_msgs/msg/Odometry
      frame: map          # 位姿在 local map;twist 在 base_link
      qos: sensor_data
      purpose: EKF 融合位姿与速度 (x, y, psi, u, v, r)
    - topic: /mavros/imu/data
      type: sensor_msgs/msg/Imu
      frame: base_link
      qos: sensor_data
      purpose: 直接陀螺仪角速度,提供比 odom 更灵敏的 r 测量
    - topic: /path/reference
      type: nav_msgs/msg/Path
      frame: map
      qos: depth=10
      purpose: 规划器参考路径 (位置 + 航向);header.stamp 用于与 profile 配对
    - topic: /path/reference_profile
      type: std_msgs/msg/Float64MultiArray
      qos: depth=10
      purpose: 逐点速度剖面 [M,4]=(v, kappa, r, t),与 /path/reference 逐点对应
      # stamp 同步契约见下方 path_profile_sync
    - topic: /mavros/state
      type: mavros_msgs/msg/State
      qos: depth=10
      purpose: FCU 连接/解锁/模式 (armed, mode),驱动 STANDBY/ACTIVE 状态机
  publishes:
    - topic: /mavros/rc/override
      type: mavros_msgs/msg/OverrideRCIn
      qos: depth=10
      purpose: NMPC 控制输出 (RC 通道覆写);MPC 推力 → throttle/steering PWM
      rc_channels:
        steering: { channel: 1, default_index: 0 }   # CH1, rc_steering_channel=0
        throttle: { channel: 3, default_index: 2 }   # CH3, rc_throttle_channel=2
      pwm_range: { min: 1100, center: 1500, max: 1900 }
      # 释放: 全零 OverrideRCIn 表示释放所有通道 (FCU 回到正常 RC 输入)
      # 适用方案: B (动力学 NMPC, MANUAL 模式)
    - topic: /mavros/setpoint_velocity/cmd_vel
      type: geometry_msgs/msg/TwistStamped
      frame: base_link      # twist 在机体坐标系 (u_surge, r_yaw)
      qos: reliable depth=10
      purpose: 运动学 MPC 控制输出 (方案 A);MAVROS setpoint_velocity → FCU GUIDED
      fields:
        linear.x:  u_surge (m/s)
        angular.z: r_yaw (rad/s)
      # 适用方案: A (运动学 MPC, GUIDED 模式)
      # 2026-10-21: 此前契约只记录 rc/override, 与实机部署的方案 A 不符,
      # 导致 bag 录制清单也漏掉真正的控制输出。
    - topic: /mpc/status
      type: std_msgs/msg/String
      qos: depth=10
      payload: JSON
      purpose: 求解器诊断 (mode_manager_node 消费 + GCS 显示)
      # 关键字段: state(ACTIVE/HOLD/STANDBY), success, fail_count,
      #           solve_time_ms, deadline_miss, hold, control_mode,
      #           fcu_mode, armed, path_received, profile_synced,
      #           tl_n/tr_n (执行层等效推力), tl_cmd_n/tr_cmd_n (求解器计划),
      #           actuation_anchor_source, actuation_mapping_error_n;
      # 方案 A 另含: initial_state_residual, max_dynamics_residual,
      #              max_control_bound_violation, max_control_rate_violation
      # mode_manager 消费: success/fail_count/solve_time_ms/hold/state/
      #                  standby_reason/allowed_fcu_modes
      # allowed_fcu_modes 是自动切模式的目标 (A=GUIDED, B=MANUAL),
      # 由 mpc_params_A/B.yaml 各自声明, 不再依赖 launch 传参。
    - topic: /mpc/predicted_trajectory
      type: nav_msgs/msg/Path
      frame: map
      qos: depth=10
      purpose: MPC 预测轨迹可视化 (每 5 个控制周期发布一次)

path_planner_node:
  subscribes:
    - topic: /mavros/local_position/odom
      type: nav_msgs/msg/Odometry
      purpose: 当前位姿 (TOPP 起点速度 v_start 取 odom.twist.linear.x)
    - topic: /usv/mission/waypoints_local
      type: nav_msgs/msg/Path
      purpose: mission_bridge 下发的局部航点 (仅位置;航向由 fillet 倒角推导)
  publishes:
    - topic: /path/reference
      type: nav_msgs/msg/Path
      frame: map
      purpose: 平滑参考路径 (fillet 圆弧倒角);与 profile 同周期发布
    - topic: /path/reference_profile
      type: std_msgs/msg/Float64MultiArray
      purpose: TOPP 速度剖面 [M,4]=(v, kappa, r, t);与 path 同周期同长度发布

mission_bridge_node:
  subscribes:
    - topic: /mavros/mission/waypoints
    - topic: /mavros/global_position/gp_origin
  publishes:
    - topic: /usv/mission/waypoints_local
      type: nav_msgs/msg/Path
      purpose: 经纬度航点 → 局部 map 坐标

mode_manager_node:
  subscribes:
    - topic: /mavros/state
    - topic: /mpc/status               # 解析 JSON,监视求解器健康
    - topic: /mavros/local_position/odom  # 电子围栏 / 速度限制
    - topic: /path/reference           # 路径看门狗
    - topic: /usv/battery         # 动力电池 failsafe; 严禁回退 /mavros/battery
                                  # (飞控为 DCDC 12V 稳压轨，动力电池固定订阅 WeAct 功率计)
  services:
    - /mavros/set_mode
    - /mavros/cmd/arming

# ---------------------------------------------------------------------------
# GPS 状态话题 (2026-10-09 加入 bag_topics.yaml 录制; RTK 事后分析用)
# ---------------------------------------------------------------------------
# 用途: 区分任务录制数据中的定位质量段 (单点/RTK Float/RTK Fixed),配合
# odom (EKF 融合了 RTK 结果) 做参数辨识与跟踪误差分析。
# RTCM 差分原始流 (/mavros/gps_rtk/send_rtcm) 不录制: 5Hz 高流量, 事后无法重放。
gps_status_topics:
  - topic: /mavros/gpsstatus/gps1/raw
    type: mavros_msgs/msg/GPSRAW
    qos: sensor_data
    purpose: fix_type (3=单点, 5=RTK Float, 6=RTK Fixed), eph, 卫星数
  - topic: /mavros/global_position/raw/fix
    type: sensor_msgs/msg/NavSatFix
    qos: sensor_data
    purpose: GPS 经纬度原值; 亦为 NTRIP 客户端 GGA 上报来源 (ntrip_client 原生直连)


# ---------------------------------------------------------------------------
# WeAct 功率计电池 (2026-11-14 加入, 2026-11-14 起 bag_topics.yaml 录制)
# ---------------------------------------------------------------------------
# 数据源: WeAct PowerMonitorMini V1, Pi5 GPIO UART 直连
# (dtoverlay=uart4-pi5 → /dev/ttyAMA4, GPIO12/13 与设备交叉接线并共地;
#  GPIO14/15 /dev/ttyAMA10 已被 MAVROS 独占)。协议 v1.3, CRC8-0x31 帧尾。
# 接线与协议细节见 usv_bringup/power_monitor_node.py 模块 docstring。
power_monitor_node:
  publishes:
    - topic: /usv/battery
      type: sensor_msgs/msg/BatteryState
      qos: sensor_data
      purpose: 电池电压/电流/荷电状态
      fields:
        voltage: 功率计实测电压 (V)
        current: 放电为负 (A; 设备电流正方向为输入→输出, 已按 BatteryState 约定取反)
        percentage: 动力电池 (6S) 总压量程线性映射 (25.0V~29.0V) 或 LiPo 单芯折算, 带载压降偏低读,
                    低电量判据仍以 mode_manager 绝对电压阈值为准
        serial_number: 设备序列号 (连接时读取一次)

# ---------------------------------------------------------------------------
# MAVLink 双向原始帧 (MAVROS 2.14 原生接口; 2026-11-11 加入 bag_topics.yaml)
# ---------------------------------------------------------------------------
# 用途: 参数辨识的离线重解与输入—输出对齐。保留全部消息 ID 与 framing_status,
# 不按已知插件/消息 ID 过滤, 不另建桥接节点。
#
# 记录边界 (必须逐条保留, 不得简化成"录到了飞控全部数据"):
#   - 只覆盖树莓派 UAS 端点实际收发的帧, 不是全飞控物理通道的旁路抓包。
#   - 独立数传/地面站之间不经过本 UAS 的交换无法记录; GCS↔FCU 端点直连
#     转发也不保证出现在这两个话题中。本任务不恢复 GCS/TCP 转发。
#   - 解析器丢弃的串口噪声、残帧、不支持的 incompat_flags 不会出现;
#     签名未被验证。FRAMING_OK 不等于签名认证通过。
#   - 帧封装不能补齐未下传的飞控内部高频量; 只有原始帧不保证够辨识,
#     未下传的内部量只能取自其他真实数据源 (例如飞控 BIN 日志)。
#   - /uas1/mavlink_sink 只表示 MAVROS 的发送意图, 不证明串口已发出,
#     也不证明飞控已执行。不得把它记作实际执行量。
mavlink_frames:
  - topic: /uas1/mavlink_source
    type: mavros_msgs/msg/Mavlink
    direction: from_fcu          # 路由器交给 UAS 的入站帧
    publisher: mavros_node       # MAVROS UAS 端点
    frame_source: header.frame_id = "ep:<id>"   # 结合端点配置确认 FCU 串口来源
    qos: best_effort / volatile / keep_last depth=1000
    timestamp: ROS 时间, 路由器解析后发布时刻; 不是 UART 首字节到达时间
    integrity: 保留 framing_status, magic, len, flags, seq, sysid, compid,
               msgid, checksum, payload64, signature; 含可路由的坏 CRC 帧,
               不含解析器丢弃的噪声/残帧/不支持的 incompat_flags
  - topic: /uas1/mavlink_sink
    type: mavros_msgs/msg/Mavlink
    direction: to_fcu            # UAS 封装后发出的报文
    publisher: mavros_node
    frame_source: 由 MAVROS 发出, 含控制/请求等; 无外部来源端点标识
    qos: best_effort / volatile / keep_last depth=1000
    timestamp: ROS 时间, UAS 发布前时刻; 不是实际线路发送时间
    integrity: 同上; 发送意图, 不等于串口已发出或飞控已执行
  # 时间轴: bag 接收时间、帧 ROS header 时间、载荷内 FCU boot/usec 时间是
  # 三条不同时间轴。不要把收/发两个话题强行合成为单一有序线流, 也不要用
  # ROS 时间差声称测出串口延迟。序号连续性必须按 方向+来源+sysid/compid
  # 跨全部 msgid 检查, 不能按 msgid 分组后把正常序号跳跃误报为丢包。

# ---------------------------------------------------------------------------
# path / profile 时间同步契约 (核心)
# ---------------------------------------------------------------------------
# /path/reference (NavPath) 与 /path/reference_profile (Float64MultiArray) 必须由
# path_planner_node 在同一周期、同长度发布,以便 mpc_node 按时间重采样动力学参考。
#
# /path/reference 的 stamp = path_msg.header.stamp
#   (path_planner_node._publish_path 用 get_clock().now() 写入)
#
# /path/reference_profile 无 header 字段,stamp 编码进 Float64MultiArray.layout.dim
# 的末两维 (path_planner_node._build_profile_msg):
#   - dim.label = "stamp_sec:<sec>"      # 整数秒
#   - dim.label = "stamp_nanosec:<nanosec>"  # 纳秒
# 两个 dim 的 size=0, stride=0, 仅作元数据载体。
#
# 解析方: usv_nmpc utils.hpp usv_mpc::parse_profile_stamp(layout) -> (sec, nanosec)
# 同步判据: usv_nmpc utils.hpp usv_mpc::profile_sync_state(path_len, profile_len, path_stamp, profile_stamp)
#   - 长度相等 且 stamp 相等 -> "stamp_match" (优先按时间重采样)
#   - stamp 缺失 -> "legacy_no_profile_stamp" (兼容旧规划器,仍按长度对齐)
#   - 长度/stamp 不一致 -> 回退匀速弧长采样, profile_synced=False
#
# 消费方: mpc_node._profile_callback / _build_reference (按 profile_stamp 与
#         _reference_path_stamp 比对决定参考构建路径)。
path_profile_sync:
  reference_topic: /path/reference
  profile_topic: /path/reference_profile
  stamp_encoding:
    layout_dim_labels: ["stamp_sec", "stamp_nanosec"]
  parser: usv_nmpc::usv_mpc::parse_profile_stamp
  sync_check: usv_nmpc::usv_mpc::profile_sync_state
  consumer: mpc_node.MpcControllerNode._build_reference
