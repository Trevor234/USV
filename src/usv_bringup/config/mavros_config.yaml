# 无人艇 AET-H743-AIR-PRO 的 MAVROS 配置
#
# 串口连接：树莓派 5 上已验证的飞控 MAVLink 端口 → /dev/ttyAMA10
# 波特率：921600
#
# fcu_url：树莓派与飞控之间的主 MAVLink 链路
#
# 仅加载本工作区使用的插件，避免 Jazzy 版本 MAVROS 中无关状态插件在
# /mavros/mavros/status 上引发话题类型冲突。

/**:
  ros__parameters:
    fcu_url: "/dev/ttyAMA10:921600"
    # 2026-11-11: gcs_url 置空。原先 "tcp-l://:14550" 让 mavros 监听 14550 并
    # 与 frpc 的 mavlink-tcp 隧道(同样指向 14550)重叠，实测从未有地面站连入，
    # 属纯开销，已连同 frpc 隧道一并移除。需要地面站直连时改为：
    #   gcs_url: "udp://@<gcs-ip>:14550"
    gcs_url: ""
    tgt_system: 1
    tgt_component: 1
    system_id: 255
    component_id: 191
    target_system_id: 1
    target_component_id: 1
    fcu_protocol: "v2.0"
    use_comp_id_system_control: false

    plugin_allowlist:
      - "local_position"
      - "imu"
      - "rc_io"
      - "rc_override"
      - "setpoint_velocity"
      - "command"
      - "global_position"
      - "waypoint"
    plugin_denylist:
      - "_disabled_plugin_name_that_matches_nothing"
      # 2026-11-11: sys_time 插件必须停用。
      # 飞控重启后发出 SYSTEM_TIME.time_unix_usec = 3155760742730791 (year~2070),
      # sec = 3155760742 > INT32_MAX, cast 成负 int32 后 rclcpp::Time 抛
      # "cannot store a negative time point" 并 abort, 启动 5s 即死,
      # /uas1/mavlink_* 永远没有发布端。该 handler 不受 timesync_mode 门控
      # (get_subscriptions 无条件注册), 只有 deny 插件能绕开。
      # 本工作区没有订阅 /mavros/time_reference 或 /mavros/timesync_status。
      - "sys_time"


