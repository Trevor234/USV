# 无人艇物理参数 — 实船单一事实来源（方案 B）。
#
# 基于 ArduPilot DataFlash 日志辨识（2026-07-23），辨识报告见
# 参数识别/results/real_identification_20260723/。
#
# 纵荡参数（mass、Xu、Xuu、Xu_dot）置信度高（直航运动，R²=0.54）。
# 横荡-艏摇耦合项（Yr、Nv、Yrr、Nvv）已置零：基于 GPS 的拟合给出了使开环系统
# 不稳定的符号（A=-M^-1*D 最大特征值实部为 +0.159）。拟合得到的对角横荡/艏摇阻尼
# （Yv、Nr）予以保留。耦合项置零后，在所有测试工况点（u 最高 1.5、|v| 最高 0.5、
# |r| 最高 0.4）下最大特征值实部均为 -0.118（稳定）。
#
# 使用方：
#   - usv_nmpc/src/mpc_node.cpp（动力学 NMPC，声明 `vehicle.*`/`dynamic.*`）
#   - usv_mpc_dynamic.m（需手动保持同步）
#
# 重要：参数名必须与 mpc_node.cpp 中的 `declare_parameter` 调用完全一致
# （代码中为扁平点分命名，YAML 中为嵌套结构）。请与 mpc_params_B.yaml 风格保持一致。
# 由 real.launch.py（scheme:=B）加载使用。

/**:
  ros__parameters:
    # ----- 船体参数（供 MPC 动力学模型使用）— 实船 14.2 kg / 1.2 m -----
    vehicle:
      mass: 14.2          # 总质量（含载荷），单位 kg
      Iz: 2.13            # 艏摇转动惯量 (= m(L²+B²)/12)，单位 kg·m²
      xg: 0.12            # 重心纵向偏移（+ 向前），单位 m
      d_thruster: 0.25    # 推进器半间距（总间距 2d = 0.5 m），单位 m

      # ----- 船体几何尺寸（MPC 仅作参考）-----
      length: 1.2         # 总长，单位 m
      beam: 0.6           # 船宽，单位 m
      draft: 0.10         # 吃水深度（比仿真艇更浅），单位 m
      height: 0.30        # 干舷高度，单位 m

      # ----- 附加质量（按 Fossen 约定取负值；保守估计）-----
      Xu_dot: -2.0
      Yv_dot: -8.0
      Yr_dot: 0.0
      Nv_dot: -0.363545
      Nr_dot: -3.41        # 2026-09-03 阶段3: 由 Iz_eff=5.537 反解 (原值 -1.621220)

      # ----- 线性阻尼 -----
      # 纵荡项 (Xu) 置信度高（R²=0.54，直航运动）。
      # 横荡-艏摇耦合项 (Yr, Nv) 已置零：辨识拟合得到的正符号使开环 A=-M^-1*D
      # 不稳定（最大特征值实部 +0.159），这些项来源于低置信度的 GPS 反演横荡通道。
      # 置零后在所有测试工况点下最大实部为 -0.118（稳定）。对角横荡/艏摇阻尼
      # (Yv, Nr) 保留拟合值。
      Xu: -2.272063
      Yv: -2.629019
      Yr: 0.0             # 置零 — 见上方块注释
      Nv: 0.0             # 置零 — 见上方块注释
      Nr: -3.105           # 2026-09-03 阶段3: 原值 -4.286144

      # ----- 二次阻尼 -----
      # 保留 Xuu（高置信度）。为保持一致性，二次耦合项 (Yrr, Nvv) 与线性耦合项一并置零。
      # Yvv/Nrr 为极小的对角项，按辨识结果保留（无害）。
      Xuu: -11.571784
      Yvv: -0.05          # 极小的对角阻尼项，保留
      Yrr: 0.0            # 置零 — 共用横荡-艏摇耦合通道
      Nvv: 0.0            # 置零 — 共用横荡-艏摇耦合通道
      Nrr: -0.71           # 2026-09-03 阶段3 新增: 原值近零（极小对角项，保留）

    # ----- 推进器 -----
    # 2026-11-18 系柱拉力标定（基准电压 26.61 V）：实测单机峰值推力可达 57.66 N (97.6% 杆量)。
    # 注意：T_max/T_min/dT_max 同时也在 mpc_params_B.yaml 的 `dynamic.*` 下声明。
    # 控制器运行时限幅以 mpc_params_B.yaml 为准 (实机限幅 ±30.0 N / 1100~1900 µs，匹配巡航并防低电量 failsafe)。
    # 此处保留一份作为无人艇物理事实来源，供离线参数辨识与仿真脚本读取。
    # 反推区间尚未做拉力标定，保留 25.0 N 保守值待补测更新。
    #
    # 本工作目录的 mpc_node 不消费此块 (实机 PWM 边界见 mpc_params_B.yaml 的 rc_pwm_*,
    # 推力边界见 dynamic.T_max/T_min)。保留此块作为物理辨识结果的单一事实来源,
    # 供参数辨识脚本 (不在本工作目录内) 读取。
    thruster:
      pwm_min: 1000
      pwm_center: 1500
      pwm_max: 2000
      T_max_forward: 57.66  # 实测单侧推进器最大正向推力 (N, 2026-11-18 标定峰值)
      T_max_reverse: 25.0   # 单侧推进器最大反向推力 (N，待反推标定补充)
