# 20-release.conf — 版本化 install 入口 (drop-in)
#
# 只替换 ExecStart: 工作空间 install/setup.bash 改为运行时软链
# /home/trevor/usv_runtime/setup.bash。
#
# 注意: usv-rtk.service 的 base unit 目前只存在于 Pi 的
# /etc/systemd/system/ 下 (未纳入版本控制), 本 drop-in 只覆盖 ExecStart,
# 不复制其 ExecCondition/ExecStartPre/Restart/KillSignal。
# 部署本 drop-in 不会启动或启用该服务。
[Service]
ExecStart=
ExecStart=/bin/bash -lc 'source /opt/ros/jazzy/setup.bash && source /home/trevor/usv_runtime/setup.bash && exec ros2 launch usv_bringup ntrip.launch.py'
