# 20-release.conf — 版本化 install 入口 (drop-in)
#
# 只替换 ExecStart: 工作空间 install/setup.bash 改为运行时软链
# /home/trevor/usv_runtime/setup.bash。
#
# 其余参数 (bag_output_dir、max_cache_size=0、max_bag_duration=0、
# max_bag_size=0、storage_config_file、bash -lc) 逐字保留
# /etc/systemd/system/usv-record.service 中的版本; ExecStartPre 的挂载检查、
# FASTDDS 环境与 KillSignal 均不变。
[Service]
ExecStart=
ExecStart=/bin/bash -lc 'source /opt/ros/jazzy/setup.bash && source /home/trevor/usv_runtime/setup.bash && exec ros2 launch usv_bringup record.launch.py bag_output_dir:=/mnt/usv_bags max_cache_size:=0 max_bag_duration:=0 max_bag_size:=0 storage_config_file:=/home/trevor/.ros/mcap_realtime.yaml'
