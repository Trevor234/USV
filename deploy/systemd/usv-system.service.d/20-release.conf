# 20-release.conf — 版本化 install 入口 (drop-in)
#
# 只替换 ExecStart: 工作空间 install/setup.bash 改为运行时软链
# /home/trevor/usv_runtime/setup.bash。该软链原子指向
# /home/trevor/usv_releases/<RELEASE_ID>/install_noopt 或 install_release。
#
# 其余 ExecStart 参数 (launch 文件、scheme 变量展开、bash 选项) 逐字保留
# /etc/systemd/system/usv-system.service 中的版本; 不改 EnvironmentFile、
# 不改 fastdds.conf、不改 /etc/default/usv-system。
#
# 回退: 把 usv_runtime 软链切回已验收的 install 目录并 systemctl restart usv-system。
[Service]
ExecStart=
ExecStart=/bin/bash -c 'source /opt/ros/jazzy/setup.bash && source /home/trevor/usv_runtime/setup.bash && exec ros2 launch usv_bringup real.launch.py scheme:=${SCHEME}'
