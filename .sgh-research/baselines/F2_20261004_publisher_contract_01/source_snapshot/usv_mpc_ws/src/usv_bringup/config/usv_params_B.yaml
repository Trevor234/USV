# USV physical parameters — single source of truth for the REAL boat.
#
# Identified from ArduPilot DataFlash logs (2026-07-23). See
# 参数识别/results/real_identification_20260723/ for the identification report.
#
# SURGE parameters (mass, Xu, Xuu, Xu_dot) are high-confidence (direct forward
# motion, R²=0.54). SWAY-YAW COUPLING terms (Yr, Nv, Yrr, Nvv) are ZEROED:
# the GPS-derived fit gave them signs that made the open-loop system unstable
# (A=-M^-1*D max eigenvalue real part +0.159). Diagonal sway/yaw damping
# (Yv, Nr) is retained from the fit. After zeroing, max real part = -0.118
# across all tested working points (u up to 1.5, |v| up to 0.5, |r| up to 0.4).
#
# Used by:
#   - usv_mpc_cpp/src/mpc_node.cpp (C++ NMPC, declares `vehicle.*`/`dynamic.*`)
#   - usv_mpc_dynamic.m (kept in sync manually)
#
# IMPORTANT: parameter names must match `_declare_parameter` calls in mpc_node.py
# (flat dotted names in code, nested in YAML). Keep aligned with mpc_params.yaml style.
# VRX now generates a native SDF from usv_params_sim.yaml and shares its
# effective_vehicle.yaml with the MPC. This B variant is retained for the
# real.launch.py parameter set and is not the VRX model input by default.

/**:
  ros__parameters:
    # ----- Hull (used by MPC dynamic model) — REAL boat 14.2 kg / 1.2 m -----
    vehicle:
      mass: 14.2          # kg, total including payload
      Iz: 2.13            # kg·m², yaw moment of inertia (= m(L²+B²)/12)
      xg: 0.12            # m, CG longitudinal offset (+ forward)
      d_thruster: 0.25    # m, half of thruster spacing 2d (separation=0.5)

      # ----- Hull geometry (informational for MPC) -----
      length: 1.2         # m, length overall
      beam: 0.6           # m, beam
      draft: 0.10         # m, waterline depth (smaller draft than sim boat)
      height: 0.30        # m, freeboard above water

      # ----- Added mass (negative by Fossen convention; conservative estimates) -----
      Xu_dot: -2.0
      Yv_dot: -8.0
      Yr_dot: 0.0
      Nv_dot: -0.363545
      Nr_dot: -3.41        # 2026-09-03 阶段3: 由 Iz_eff=5.537 反解 (was -1.621220)

      # ----- Linear damping -----
      # Surge (Xu) is high-confidence (R²=0.54, direct forward motion).
      # Sway-yaw COUPLING terms (Yr, Nv) are ZEROED: the identification fit
      # gave positive signs that made the open-loop A=-M^-1*D unstable
      # (max eigenvalue real part +0.159). They come from the low-confidence
      # GPS-derived sway channel. With them zeroed, max real part = -0.118
      # (stable) across all tested working points. Diagonal sway/yaw damping
      # (Yv, Nr) is retained from the fit.
      Xu: -2.272063
      Yv: -2.629019
      Yr: 0.0             # zeroed — see block comment above
      Nv: 0.0             # zeroed — see block comment above
      Nr: -3.105           # 2026-09-03 阶段3: was -4.286144

      # ----- Quadratic damping -----
      # Xuu retained (high-confidence). Quadratic coupling terms (Yrr, Nvv)
      # zeroed together with their linear counterparts for consistency.
      # Yvv/Nrr are near-zero diagonal terms kept as-identified (harmless).
      Xuu: -11.571784
      Yvv: -0.05          # near-zero diagonal, kept
      Yrr: 0.0            # zeroed — shares sway-yaw coupling channel
      Nvv: 0.0            # zeroed — shares sway-yaw coupling channel
      Nrr: -0.71           # 2026-09-03 阶段3 新增: was ~0 (近零)         # near-zero diagonal, kept

    # ----- Thruster -----
    # K_T=25 N assumed (no bollard-pull calibration yet). T_max forward/reverse
    # are equal per identification. NOTE: T_max/T_min/dT_max are also declared in
    # mpc_params.yaml under `dynamic.*` and take precedence there for MPC.
    # Repeated here so the parameter-identification scripts read a single file.
    # Keep in sync with mpc_params.yaml.
    #
    # 本工作目录的 mpc_node 不消费此块 (实机 PWM 边界见 mpc_params.yaml 的 rc_pwm_*,
    # 推力边界见 dynamic.T_max/T_min)。保留此块作为物理辨识结果的单一事实来源,
    # 供参数辨识脚本 (不在本工作目录内) 读取。
    thruster:
      pwm_min: 1000
      pwm_center: 1500
      pwm_max: 2000
      T_max_forward: 25.0   # N per thruster (K_T)
      T_max_reverse: 25.0   # N per thruster (equal reverse)
