/**:
  ros__parameters:
    # Shared safety defaults for MAVROS-backed real/SITL launches.
    geofence_radius: 200.0
    geofence_center_x: 0.0
    geofence_center_y: 0.0
    low_battery_v: 10.5
    critical_battery_v: 10.0
    max_solver_failures: 5
    odom_timeout_s: 1.0
    max_path_timeout_s: 5.0
    max_speed_mps: 3.0
    # /mpc/status 新鲜度看门狗: ACTIVE/HOLD 期间 status 超过阈值未更新,
    # 触发所配置的 failsafe 处理; 具体触发条件见 mode_manager_node。
    # FCU 指令/RC 覆盖超时取决于固件、参数及实际指令类型, 需独立核验。
    # 此阈值与模式请求均不构成物理停船保证。
    mpc_status_timeout_s: 1.0
    # FAILSAFE 模式请求重发上限: 达到上限仍未进入所请求模式时保持告警。
    # 此计数适用于所配置的 failsafe 模式, 不仅是 RTL。
    max_rtl_retries: 10
    # FAILSAFE 触发时的动作:
    #   "report" — 报告故障, 不主动切换 FCU 模式; 需按受控流程人工处理。
    #   "HOLD"   — 请求 FCU 进入 HOLD; 切换成功及船体停止需独立确认。
    #   "RTL"    — 请求 FCU 返航; 需核对 home、传感器、链路和剩余能量。
    # report 模式下本节点自动恢复 (auto_switch) 同样被抑制。
    # 当前默认 HOLD; 不依赖“GUIDED 无超时”假设。
    # 实机验收需检查固件、指令类型、持续重发来源、模式确认与停止效果。
    failsafe_mode: "HOLD"
